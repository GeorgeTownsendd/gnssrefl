name: ci

on:
  push:
    branches:
      - "master"
  pull_request: {}

env:
  GOLDEN_COMMIT_FILE: test/GOLDEN_COMMIT

jobs:
  build:
    name: "CI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build Docker image
        run: |
          docker build . -t gnssrefl
      - name: Create Docker container
        run: |
          docker run --name gnssrefl -d -v "$PWD:/src" gnssrefl tail -f /dev/null
      - name: Run smoke tests
        run: |
          docker exec -i gnssrefl /src/software_tests
      - name: Generate expected output (pinned baseline)
        run: |
          docker exec -i gnssrefl /src/test/run_processing.sh "$(cat $GOLDEN_COMMIT_FILE)" /src/test/data/expected
      - name: Generate actual output (current code)
        run: |
          docker exec -i gnssrefl /src/test/run_processing.sh local /src/test/data/actual
      - name: Install test dependencies
        run: |
          docker exec -i gnssrefl pip3 install -r /src/requirements-dev.txt
      - name: Run unit tests
        run: |
          docker exec -i gnssrefl pytest /src/test -v
